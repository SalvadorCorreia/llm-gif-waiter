<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="options.css">
  <title>GIF Waiter Settings</title>
</head>
<body>
  <div class="container">
    <h1>GIF Waiter Settings</h1>

    <div class="settings-section">
      <h2>GIF Gallery</h2>
      <label class="toggle-row" style="margin-bottom: 2px;">
        <span>Randomize Active GIFs</span>
        <input type="checkbox" id="randomize-toggle">
      </label>
      <label class="toggle-row" id="interval-container" style="display: none; padding-top: 4px; padding-bottom: 12px; border-top: none;">
        <span style="font-size: 14px; opacity: 0.8;">Cycle Interval (seconds)</span>
        <input type="number" id="randomize-interval" min="1" max="120" value="5" class="interval-input">
      </label>
      <p class="hint">When enabled, click multiple GIFs to create a rotation pool.</p>
      
      <div class="grid" id="gif-grid">
        <!-- Default GIFs injected here via JS -->
        
        <!-- Custom Input Slot -->
        <div class="grid-item custom-slot" id="custom-slot">
          <div class="placeholder" id="custom-placeholder">
            <span class="plus-sign">+</span>
          </div>
          <div class="custom-input-container" id="custom-input-container" style="display: none;">
            <input type="text" id="custom-gif-url" placeholder="Paste direct GIF URL...">
            <button id="save-custom-btn">Save Link</button>
          </div>
        </div>
      </div>
    </div>

    <div class="settings-section config-section">
      <h2>Layout Preferences</h2>
      <label class="toggle-row">
        <span>Dark Mode</span>
        <input type="checkbox" id="dark-mode-toggle">
      </label>
      <label class="toggle-row">
        <span>Provider-Specific Layouts</span>
        <input type="checkbox" id="provider-layout-toggle">
      </label>
      <label class="toggle-row">
        <span>Lock GIF Size</span>
        <input type="checkbox" id="lock-size-toggle">
      </label>
      <p class="hint">When locked, changing GIFs will fit exactly inside your set boundaries without shifting.</p>
    </div>

    <div class="settings-section config-section">
      <h2>Active Providers</h2>
      <p class="hint">Disable the extension on specific AI platforms.</p>
      <div id="provider-list" class="provider-list"></div>
    </div>
  </div>

  <script src="../core/src/registry.js"></script>
  <script src="options.js"></script>
</body>
</html>
