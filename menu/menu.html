<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <div class="header">
    <h2>GIF Waiter</h2>
  </div>
  
  <div class="analytics-card">
    <div>
      <span class="label">Time Saved Watching GIFs:</span><br>
      <span class="value" id="time-display">0m 0s</span>
    </div>
    <button id="reset-time-btn" class="reset-btn">Reset</button>
  </div>

  <div class="settings-group">
    <label class="toggle-row">
      <span>Enable Extension</span>
      <input type="checkbox" id="global-toggle">
    </label>
    <label class="toggle-row">
      <span>Dark Mode</span>
      <input type="checkbox" id="dark-mode-toggle">
    </label>
  </div>

  <div class="settings-group">
    <button id="open-options-btn" style="width: 100%; padding: 10px; cursor: pointer; border-radius: 6px; border: none; background-color: #0066cc; color: white; font-weight: bold; font-size: 14px;">Advanced Settings & Gallery</button>
  </div>

  <script src="menu.js"></script>
</body>
</html>
